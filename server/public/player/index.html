<!doctype html>
<html lang="hu" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Signage lejátszó</title>
  <link rel="stylesheet" href="player.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <div id="boot"><img src="/shared/splash/logo.svg" alt=""></div>
  <div id="rotor"><div id="stage"></div>
    <div id="brand-header" hidden></div>
    <img id="brand-logo" hidden alt="">
    <div id="overlay-clock" hidden></div>
    <div id="ticker" hidden><div class="ticker-track"></div></div>
    <div id="alerts"></div>
    <div id="nav" hidden>
      <button data-nav="home" aria-label="Kezdőlap">⌂</button>
      <button data-nav="back" aria-label="Vissza">←</button>
    </div>
    <div id="progress"></div>
    <div id="identify" hidden></div>
    <div id="offline" hidden>● Offline – tárolt tartalom</div>
    <div id="keyboard" hidden></div>
    <div id="blank" hidden></div>
  </div>
  <div id="pairing" hidden>
    <div class="pair-card">
      <div class="pair-logo">◐</div>
      <h1>Képernyő párosítása</h1>
      <p>Az admin felületen a <b>Képernyők → Új képernyő</b> menüben add meg ezt a kódot:</p>
      <div id="pair-code">------</div>
      <p class="pair-url" id="pair-url"></p>
      <p class="pair-info" id="pair-info"></p>
    </div>
  </div>
  <div id="status" hidden>
    <div class="pair-card">
      <div class="pair-logo spin">◐</div>
      <h1 id="status-title">Kapcsolódás…</h1>
      <p id="status-detail" class="pair-url"></p>
      <p class="pair-info" id="status-info"></p>
    </div>
  </div>
  <script src="/shared/themes.js"></script>
  <script src="player.js"></script>
</body>
</html>
