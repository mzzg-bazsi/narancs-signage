# A Windows telepítő kipróbálása egy valódi Windows gépen (szerver + kijelző, majd eltávolítás)
name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['install/install.ps1', 'install/windows/**', '.github/workflows/windows.yml']
    tags: ['v*']
permissions:
  contents: write
jobs:
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Telepítés (Windows PowerShell 5.1, ugyanúgy szkriptblokkként, mint az irm | iex)
        shell: powershell
        run: |
          # Node.js nélküli gépet utánzunk: a telepítőnek magának kell letöltenie
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'node.exe')) }) -join ';'
          if (Get-Command node -ErrorAction SilentlyContinue) { throw 'node is still on PATH' }
          & ([scriptblock]::Create((Get-Content -Raw install\install.ps1))) -Mode both -Port 8090 -Source .
          if (-not (Test-Path "$env:ProgramData\NarancsSignage\node\node.exe")) { throw 'own node.exe missing' }
      - name: Ellenőrzés
        shell: powershell
        run: |
          $h = Invoke-RestMethod http://127.0.0.1:8090/healthz
          if (-not $h.ok) { throw 'healthz' }
          if (-not (Get-ScheduledTask -TaskName 'Narancs Signage Server')) { throw 'task' }
          $lnk = Join-Path ([Environment]::GetFolderPath('Startup')) 'Narancs Signage Display.lnk'
          if (-not (Test-Path $lnk)) { throw 'shortcut' }
          (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).Arguments
          (Invoke-WebRequest http://127.0.0.1:8090/install-player.sh -UseBasicParsing).StatusCode
          Get-Content "$env:ProgramData\NarancsSignage\install.json"
      - name: Újrafuttatás (frissítés), menü nélkül az előző beállításokkal
        shell: powershell
        run: |
          & ([scriptblock]::Create((Get-Content -Raw install\install.ps1))) -Mode both -Source .
          if (-not (Invoke-RestMethod http://127.0.0.1:8090/healthz).ok) { throw 'port nem maradt meg' }
      - name: Eltávolítás
        shell: powershell
        run: |
          & ([scriptblock]::Create((Get-Content -Raw install\install.ps1))) -Uninstall
          if (Get-ScheduledTask -TaskName 'Narancs Signage Server' -ErrorAction SilentlyContinue) { throw 'task maradt' }
          if (-not (Test-Path "$env:ProgramData\NarancsSignage\data")) { throw 'az adat elveszett' }
      - name: Csak kijelző (kioszk gép), egy másik szerverre mutatva
        shell: powershell
        run: |
          & ([scriptblock]::Create((Get-Content -Raw install\install.ps1))) -Mode screen -Server 192.168.1.10:8080/ -Source .
          $t = Get-ScheduledTask -TaskName 'Narancs Signage Display'
          $t.Principal.UserId
          if ($t.Actions[0].Execute -notlike '*NarancsSignage\kiosk.exe') { throw 'kiosk task' }
          if (-not (Test-Path "$env:ProgramData\NarancsSignage\agent.exe")) { throw 'agent.exe was not built' }
          if (-not (Get-ScheduledTask -TaskName 'Narancs Signage Agent' -ErrorAction SilentlyContinue)) { throw 'agent task' }
          $c = Get-Content "$env:ProgramData\NarancsSignage\install.json" -Raw | ConvertFrom-Json
          if ($c.server -ne 'http://192.168.1.10:8080' -or $c.device -notmatch '^[0-9a-f]{32}$') { throw ('install.json: ' + ($c | ConvertTo-Json)) }
          $w = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
          if ($w.AutoAdminLogon -ne '1' -or $w.DefaultUserName -ne 'NarancsKiosk') { throw 'autologon' }
          if ($w.DefaultPassword) { throw 'password must not be in the registry as text' }
          if ((Get-LocalGroupMember -SID 'S-1-5-32-544').Name -like '*NarancsKiosk') { throw 'kiosk account must not be admin' }
          # a kioszk szkript szintaxisa (PowerShell parser)
          if (Get-ScheduledTask -TaskName 'Narancs Signage Server' -ErrorAction SilentlyContinue) { throw 'szerver nem kellett volna' }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp\Narancs Signage Kiosk.lnk")) { throw 'kiosk startup link' }
      - name: A kioszk program tényleg elindítja az Edge-et (a futó felhasználóval)
        shell: powershell
        run: |
          $p = Start-Process "$env:ProgramData\NarancsSignage\kiosk.exe" -PassThru
          $edge = $null
          for ($i = 0; $i -lt 30 -and -not $edge; $i++) { Start-Sleep 2; $edge = Get-CimInstance Win32_Process -Filter "Name='msedge.exe'" | Where-Object { $_.CommandLine -like '*NarancsSignage\kiosk*' } }
          Get-Content "$env:ProgramData\NarancsSignage\kiosk\kiosk-$env:USERNAME.log"
          if (-not $edge) { throw 'Edge did not start' }
          ($edge | Select-Object -First 1).CommandLine
          if (Select-String -Path "$env:ProgramData\NarancsSignage\kiosk\kiosk-$env:USERNAME.log" -Pattern 'error:' -Quiet) { throw 'kiosk.exe logged an error' }
          # képernyőkép kérés a mappán át (ahogy az ügynök kéri)
          New-Item -ItemType File "$env:ProgramData\NarancsSignage\kiosk\shot.req" -Force | Out-Null
          for ($i = 0; $i -lt 20 -and -not (Test-Path "$env:ProgramData\NarancsSignage\kiosk\shot.jpg"); $i++) { Start-Sleep 1 }
          if (Test-Path "$env:ProgramData\NarancsSignage\kiosk\shot.jpg") { 'screenshot OK: ' + (Get-Item "$env:ProgramData\NarancsSignage\kiosk\shot.jpg").Length } else { 'no screenshot (no interactive desktop on the runner?)' }
          Stop-Process -Id $p.Id -Force
          $edge | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
      - name: Kioszk eltávolítása
        shell: powershell
        run: |
          & ([scriptblock]::Create((Get-Content -Raw install\install.ps1))) -Uninstall
          if (Get-LocalUser NarancsKiosk -ErrorAction SilentlyContinue) { throw 'kiosk account left behind' }
          if ((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon').AutoAdminLogon -eq '1') { throw 'autologon maradt' }
      - name: Tálca szkript szintaxisa
        shell: powershell
        run: |
          foreach ($f in 'install\windows\tray.ps1') {
            $e = $null; [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$e); if ($e) { throw ($f + ': ' + ($e | Out-String)) }
          }
      - name: Ügynök élőben - szerver, majd egy kioszk, ami ehhez csatlakozik
        shell: powershell
        run: |
          & ([scriptblock]::Create((Get-Content -Raw install\install.ps1))) -Mode server -Port 8093 -Source .
          & ([scriptblock]::Create((Get-Content -Raw install\install.ps1))) -Mode screen -Server http://127.0.0.1:8093 -Source .
          $dev = (Get-Content "$env:ProgramData\NarancsSignage\device" -Raw).Trim()
          $H = @{ 'X-Signage' = '1' }
          Invoke-RestMethod -Method Post http://127.0.0.1:8093/api/auth/setup -Headers $H -ContentType 'application/json' -SessionVariable ws -Body (@{ username = 'admin'; password = 'admin-jelszo-123'; org_name = 'CI'; language = 'en' } | ConvertTo-Json) | Out-Null
          $hi = Invoke-RestMethod -Method Post http://127.0.0.1:8093/api/player/hello -ContentType 'application/json' -Body (@{ device = $dev } | ConvertTo-Json)
          Invoke-RestMethod -Method Post http://127.0.0.1:8093/api/screens/pair -Headers $H -WebSession $ws -ContentType 'application/json' -Body (@{ code = $hi.code; name = 'CI kiosk' } | ConvertTo-Json) | Out-Null
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) { Start-Sleep 2; $sc = (Invoke-RestMethod http://127.0.0.1:8093/api/screens -WebSession $ws).screens[0]; $ok = $sc.agent_online -and $sc.info.agent.version }
          $sc.info.agent | ConvertTo-Json
          if (-not $ok) { throw 'agent did not connect / report' }
          Invoke-RestMethod -Method Post "http://127.0.0.1:8093/api/screens/$($sc.id)/command" -Headers $H -WebSession $ws -ContentType 'application/json' -Body '{"command":"restart"}' | ConvertTo-Json
          & ([scriptblock]::Create((Get-Content -Raw install\install.ps1))) -Uninstall
          if (Get-ScheduledTask -TaskName 'Narancs Signage Agent' -ErrorAction SilentlyContinue) { throw 'agent task left behind' }
      - name: Kézi indításkor a kiadott telepítő a GitHubról (letöltés, irm)
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          & ([scriptblock]::Create((irm https://raw.githubusercontent.com/mzzg-bazsi/narancs-signage/main/install/install.ps1))) -Mode server -Port 8091
          (Invoke-RestMethod http://127.0.0.1:8091/healthz).version

  # Grafikus telepítő (Inno Setup): fordítás, csendes telepítés + eltávolítás próbája, tagnél feltöltés a kiadásba
  setup-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Fordítás
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          # a licenc BOM-mal, hogy az ékezetek jól látszódjanak a varázslóban
          Get-Content LICENSE -Encoding UTF8 | Set-Content install\windows\LICENSE.txt -Encoding UTF8
          # a Node.js a telepítőbe kerül (aktuális LTS, x64)
          $lts = ''; foreach ($r in (Invoke-RestMethod https://nodejs.org/dist/index.json)) { if ($r.lts) { $lts = [string]$r.version; break } }
          New-Item -ItemType Directory -Force install\windows\node | Out-Null
          Invoke-WebRequest "https://nodejs.org/dist/$lts/win-x64/node.exe" -OutFile install\windows\node\node.exe -UseBasicParsing
          $v = (Get-Content server\package.json -Raw | ConvertFrom-Json).version
          & $iscc /Qp "/DAppVersion=$v" install\windows\setup.iss
          if ($LASTEXITCODE) { throw 'ISCC' }
      - name: Csendes telepítés (szerver + kijelző) és eltávolítás
        shell: powershell
        run: |
          Start-Process install\windows\Output\NarancsSignageSetup.exe '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TYPE=both /PORT=8092' -Wait
          Get-Content "$env:ProgramData\NarancsSignage\setup.log"
          if (-not (Invoke-RestMethod http://127.0.0.1:8092/healthz).ok) { throw 'healthz' }
          # a kiadott lejátszó telepítő Linuxon fut: Windows sorvég (CR) nem lehet benne
          $sh = (Invoke-WebRequest http://127.0.0.1:8092/install-player.sh -UseBasicParsing).Content
          if ($sh.Contains("`r")) { throw 'install-player.sh has CRLF line endings' }
          if ((Get-Content "$env:ProgramData\NarancsSignage\install\install-player.sh" -Raw).Contains("`r")) { throw 'the installed install-player.sh has CRLF (.gitattributes?)' }
          Start-Process "${env:ProgramFiles}\Narancs Signage\unins000.exe" '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Get-ScheduledTask -TaskName 'Narancs Signage Server' -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          if (Get-ScheduledTask -TaskName 'Narancs Signage Server' -ErrorAction SilentlyContinue) { throw 'uninstall did not run' }
      - name: Csendes telepítés (csak kijelző, kioszk)
        shell: powershell
        run: |
          Start-Process install\windows\Output\NarancsSignageSetup.exe '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TYPE=screen /SERVER=http://192.168.1.10:8080' -Wait
          Get-Content "$env:ProgramData\NarancsSignage\setup.log"
          if (-not (Get-ScheduledTask -TaskName 'Narancs Signage Display' -ErrorAction SilentlyContinue)) { throw 'kioszk feladat' }
      - uses: actions/upload-artifact@v4
        with: { name: NarancsSignageSetup, path: install/windows/Output/NarancsSignageSetup.exe }
      - name: Feltöltés a kiadásba
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # a release.sh a tag után hozza létre a kiadást – megvárjuk
          for i in $(seq 1 30); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 10; done
          gh release upload "$GITHUB_REF_NAME" install/windows/Output/NarancsSignageSetup.exe --clobber
